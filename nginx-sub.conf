# Конфигурация Nginx для сервиса подписок и дашборда VPN
server {
    listen 80;
    server_name sub.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все запросы к лендингу и API отправляем на микросервис FastAPI (порт 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Запросы за самими подписками (конфигами) отдаем напрямую в панель 2S-UI (порт 2096)
    location /sub/ {
        proxy_pass https://127.0.0.1:2096/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


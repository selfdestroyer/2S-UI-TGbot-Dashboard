# Пример конфигурации Nginx для дашборда VPN (рабочую конфигурацию генерирует install.sh)
server {
    listen 80;
    server_name sub.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все запросы к лендингу и API отправляем на микросервис FastAPI (порт 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Короткая ссылка sub.example.com/sub/<имя> -> подписка панели 2S-UI (порт 2096).
    # Путь передаётся целиком (без / в proxy_pass), панели нужны её домен в SNI и Host.
    location /sub/ {
        proxy_pass https://127.0.0.1:2096;
        proxy_ssl_server_name on;
        proxy_ssl_name example.com;
        proxy_ssl_verify off;
        proxy_set_header Host example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

